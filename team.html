<style id="ckcss">

function openEd(it){ed=it||null;cDel=false;g("fdDlgT").textContent=it?"編輯資料夾":"新增資料夾";g("fde-name").value=it?it.name:"";g("fde-url").value=it?it.url:"";g("fde-note").value=it&&it.note||"";g("fde-pin").checked=!!(it&&it.pinBottom);
g("fdeErr").textContent="";g("fde-del").hidden=!it;g("fde-del").textContent="刪除";g("fdDlg").showModal();g("fde-name").focus()}
g("fdForm").addEventListener("submit",async function(ev){ev.preventDefault();
var d={name:g("fde-name").value.trim(),url:g("fde-url").value.trim(),note:g("fde-note").value.trim(),pinBottom:g("fde-pin").checked};
if(!/^https:\/\//i.test(d.url)){g("fdeErr").textContent="連結需以 https:// 開頭。";return}
g("fde-save").disabled=true;
try{if(ed)await db.doc("folders/"+ed.id).update(d);else await db.collection("folders").add(Object.assign(d,{order:Date.now()}));g("fdDlg").close()}catch(e){g("fdDlg").close();err(e)}
g("fde-save").disabled=false});
g("fde-cancel").addEventListener("click",function(){g("fdDlg").close()});
g("fde-del").addEventListener("click",async function(){if(!cDel){cDel=true;g("fde-del").textContent="再按一次確認刪除";return}
try{await db.doc("folders/"+ed.id).delete();g("fdDlg").close()}catch(e){g("fdDlg").close();err(e)}});
g("fdAdd").addEventListener("click",function(){openEd(null)});
(async function(){try{db=window.claude&&await window.claude.use("db")}catch(e){db=null}
if(!db){canW=false;items=(window.SNAP&&SNAP.folders)||[];render();g("fdStatus").style.color="var(--mute)";g("fdStatus").textContent=(window.claude?"目前未登入，顯示 ":"最後更新 ")+((window.SNAP&&SNAP.at)||"")+(window.claude?" 更新的版本（僅供查閱）。":"（僅供查閱）");return}
db.collection("folders").onSnapshot(function(s){items=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});render()},function(){g("fdStatus").textContent="連線中斷，請重新整理頁面。"})})();
})();

<script type="text/plain" id="pagesrc"></script>
<script>
(function(){
var SK='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
var K1="__"+"SNAP__",K2="__"+"SRC__";
var live={schedule:null,tasks:null,folders:null},dismissed=false,busy=false,art=null,webMeta=undefined,dbRef=null;
function g(id){return document.getElementById(id)}
function stable(v){if(Array.isArray(v))return"["+v.map(stable).join(",")+"]";if(v&&typeof v==="object")return"{"+Object.keys(v).sort().filter(function(k){return v[k]!==undefined}).map(function(k){return JSON.stringify(k)+":"+stable(v[k])}).join(",")+"}";return JSON.stringify(v)}
function byId(a){return(a||[]).slice().sort(function(x,y){return x.id<y.id?-1:1})}
function differs(){var S=window.SNAP||{};return stable(live.schedule)!==stable(S.schedule)||stable(byId(live.tasks))!==stable(byId(S.tasks))||stable(byId(live.folders))!==stable(byId(S.folders))}
function hashLive(boss){var s=stable({schedule:live.schedule,tasks:byId(live.tasks),folders:boss?[]:byId(live.folders)}),h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)}
function check(){if(dismissed||busy||!live.schedule||!live.tasks||!live.folders||webMeta===undefined)return;
var d=differs(),wb=!webMeta||webMeta.hashBoss!==hashLive(true),wt=!webMeta||webMeta.hashTeam!==hashLive(false),w=wb||wt;
g("pubBar").hidden=!(d||w);g("pubGo").hidden=!d;g("webGoBoss").hidden=!wb;g("webGoTeam").hidden=!wt;
var t=[];if(d)t.push("Claude 頁面的公開版本還是 "+((window.SNAP&&SNAP.at)||"")+" 的內容。");
if(w)t.push("GitHub 網頁版還沒更新（"+[wb?"長官版":"",wt?"工作人員版":""].filter(Boolean).join("、")+"）：按下方按鈕下載，再上傳到 GitHub 的 nobel-2026。");
g("pubTxt").textContent="內容已修改。"+t.join(" ")}
function b64enc(s){var b=new TextEncoder().encode(s),o="";for(var i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)}
function b64dec(s){var r=atob(s.trim()),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return new TextDecoder().decode(u)}
function stamp(){var d=new Date(Date.now()+8*3600e3).toISOString();return d.slice(5,7)+"/"+d.slice(8,10)+" "+d.slice(11,16)}
g("pubLater").addEventListener("click",function(){dismissed=true;g("pubBar").hidden=true});
g("pubGo").addEventListener("click",async function(){
if(busy)return;busy=true;g("pubGo").disabled=true;g("pubTxt").textContent="正在更新公開版本…";
try{
if(!art)art=await window.claude.use("artifact");
if(!art)throw{code:"not_granted"};
var tpl=b64dec(g("pagesrc").textContent);
var snap={schedule:live.schedule,tasks:byId(live.tasks),folders:byId(live.folders),at:stamp()};
var js="var SNAP="+JSON.stringify(snap).replace(/<\//g,"<\\/")+";var DEFAULT=SNAP.schedule;";
var page=tpl.split(K1).join(js).split(K2).join(b64enc(tpl));
await art.publish(SK+page+"</body></html>");
g("pubTxt").textContent="已更新公開版本。";
}catch(e){busy=false;g("pubGo").disabled=false;var c=e&&e.code;
g("pubTxt").textContent=c==="not_granted"||c==="not_writer"?"你沒有更新公開版本的權限，請通知頁面擁有者。":c==="conflict"?"頁面剛被其他人更新，重新載入後再試一次。":"更新失敗，請稍後再試。"}});
if(!window.claude)document.querySelectorAll(".cl-only").forEach(function(b){b.hidden=true});
var dlns=null;
async function dlWeb(boss){
if(!live.schedule||!live.tasks||!live.folders){toast2("資料還在載入，請稍候再按一次。");return}
var fn=boss?"index.html":"team.html";
try{if(!dlns)dlns=await window.claude.use("downloads");if(!dlns){toast2("此環境無法下載。");return}
var tpl=b64dec(g("pagesrc").textContent);
var snap={schedule:live.schedule,tasks:byId(live.tasks),folders:boss?[]:byId(live.folders),at:stamp()};if(boss)snap.hideFiles=true;
var js="var SNAP="+JSON.stringify(snap).replace(/<\//g,"<\\/")+";var DEFAULT=SNAP.schedule;";
var page=tpl.split(K1).join(js).split(K2).join("");
var doc='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body>'+page+'</body></html>';
await dlns.save({filename:fn,data:doc});toast2("已下載 "+fn+"，請到 GitHub 的 nobel-2026 上傳覆蓋同名舊檔。");
if(dbRef){var upd={};upd[boss?"hashBoss":"hashTeam"]=hashLive(boss);upd[boss?"atBoss":"atTeam"]=snap.at;
try{if(webMeta)await dbRef.doc("meta/web").update(upd);else await dbRef.doc("meta/web").set(upd)}catch(e){}}}
catch(e){if(!e||e.code!=="declined")toast2("下載失敗，請稍後再試。")}}
g("webDlBoss").addEventListener("click",function(){dlWeb(true)});
g("webDlTeam").addEventListener("click",function(){dlWeb(false)});
function toast2(t){var e=g("toast");if(!e)return;e.textContent=t;e.hidden=false;setTimeout(function(){e.hidden=true},3500)}
(async function(){var db;try{db=window.claude&&await window.claude.use("db")}catch(e){db=null}if(!db)return;
g("webBar").hidden=false;dbRef=db;
g("webGoBoss").addEventListener("click",function(){dlWeb(true)});g("webGoTeam").addEventListener("click",function(){dlWeb(false)});
db.doc("meta/web").onSnapshot(function(s){webMeta=s.exists?s.data():null;check()},function(){webMeta=null;check()});
db.doc("schedule/main").onSnapshot(function(s){live.schedule=s.exists?s.data():null;check()},function(){});
db.collection("tasks").onSnapshot(function(s){live.tasks=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});check()},function(){});
db.collection("folders").onSnapshot(function(s){live.folders=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});check()},function(){});
})();
})();
</script>
