<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>回函統計</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1633;--gold:#e3bf6b;--cream:#f6efe0;--muted:#a9b2cf}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(170deg,#12204a,#060c22);color:var(--cream);font-family:"Noto Sans TC",system-ui,sans-serif;min-height:100svh;padding:28px 16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:"Noto Serif TC",serif;color:var(--gold);font-size:24px;letter-spacing:.1em}
.sub{color:var(--muted);font-size:13px;margin:6px 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(227,191,107,.25);border-radius:14px;padding:16px}
.card .k{font-size:13px;color:var(--muted)}
.card .v{font-size:38px;font-weight:700;color:#fff;margin-top:4px;font-variant-numeric:tabular-nums}
.card .v small{font-size:14px;color:var(--muted);font-weight:400;margin-left:4px}
.card.main{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .6s}
.foot{margin-top:18px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
button{background:none;border:1px solid rgba(227,191,107,.5);color:var(--gold);border-radius:999px;padding:7px 14px;font-family:inherit;cursor:pointer}
.list{margin-top:14px}
.list h2{font-size:15px;color:var(--gold);margin:18px 0 8px;font-weight:700}
.list h2 span{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 11px;font-size:14px}
.names .none{background:none;border:0;color:var(--muted);padding:0}
.err{color:#ff9d8f;margin-top:16px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>回函統計</h1>
  <div class="sub">諾貝爾講座｜115 年 11 月 12 日｜每分鐘自動更新</div>
  <div class="grid">
    <div class="card main"><div><div class="k">已回覆人數</div><div class="v" id="total">–</div></div></div>
    <div class="card"><div class="k">參加講座</div><div class="v" id="lecture">–<small>人</small></div><div class="bar"><i id="bl" style="width:0"></i></div></div>
    <div class="card"><div class="k">參加晚宴</div><div class="v" id="dinner">–<small>人</small></div><div class="bar"><i id="bd" style="width:0"></i></div></div>
    <div class="card"><div class="k">兩者都參加</div><div class="v" id="both">–<small>人</small></div></div>
    <div class="card"><div class="k">皆不克參加</div><div class="v" id="neither">–<small>人</small></div></div>
  </div>
  <div class="list" id="list"></div>
  <div class="err" id="err"></div>
  <div class="foot"><span id="time"></span><button id="reload">重新整理</button></div>
</div>
<script src="config.js"></script>
<script>
function set(id,n){var el=document.getElementById(id);el.firstChild.nodeValue=n;}
function load(){
  var err=document.getElementById('err'); err.textContent='';
  if(!window.RSVP_URL){err.textContent='尚未設定回函網址（config.js）';return}
  fetch(window.RSVP_URL+'?action=stats').then(function(r){return r.json()}).then(function(s){
    document.getElementById('total').textContent=s.total;
    set('lecture',s.lecture);set('dinner',s.dinner);set('both',s.both);set('neither',s.neither);
    var t=s.total||1;
    document.getElementById('bl').style.width=(s.lecture/t*100)+'%';
    document.getElementById('bd').style.width=(s.dinner/t*100)+'%';
    var L=document.getElementById('list'); L.textContent='';
    [['參加講座',s.lectureNames],['參加晚宴',s.dinnerNames],['皆不克參加',s.declinedNames]].forEach(function(g){
      if(!g[1])return;
      var h=document.createElement('h2'); h.textContent=g[0];
      var c=document.createElement('span'); c.textContent=g[1].length+' 人'; h.appendChild(c);
      var box=document.createElement('div'); box.className='names';
      if(!g[1].length){var n=document.createElement('span');n.className='none';n.textContent='（尚無）';box.appendChild(n);}
      g[1].forEach(function(nm){var n=document.createElement('span');n.textContent=nm;box.appendChild(n);});
      L.appendChild(h);L.appendChild(box);
    });
    document.getElementById('time').textContent='更新於 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  }).catch(function(){err.textContent='讀取失敗，請稍後再試'});
}
document.getElementById('reload').onclick=load;
load(); setInterval(load,60000);
</script>
</body>
</html>
