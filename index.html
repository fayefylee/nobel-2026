var WD=["日","一","二","三","四","五","六"];
var S=clone(DEFAULT),backup=null,editing=false,cur=0,dbDoc=null,toastT=null;
function clone(o){return JSON.parse(JSON.stringify(o))}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad(n){return("0"+n).slice(-2)}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function meta(date){var p=String(date).split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);if(isNaN(d.getTime()))return{tab:"日期?",wd:"",label:"日期?"};var tab=(+p[1])+"/"+(+p[2]);return{tab:tab,wd:"星期"+WD[d.getDay()],label:tab+"（"+WD[d.getDay()]+"）"}}
function toast(t){var e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){e.hidden=true},2500)}
function fill(v){var o=clone(DEFAULT);if(v&&typeof v==="object"){["title","speaker","host","upd"].forEach(function(k){if(typeof v[k]==="string")o[k]=v[k]});if(Array.isArray(v.todo))o.todo=v.todo.slice();if(Array.isArray(v.days))o.days=clone(v.days).map(function(d){d.items=Array.isArray(d.items)?d.items:[];return d})}return o}
function dh(s){return String(s).split("\n").map(function(l){return /^(講者|主講|致歡迎詞)/.test(l)?'<span class="spk">'+esc(l)+'</span>':/^Plan A/.test(l)?'<span class="dpa">'+esc(l)+'</span>':/^Plan B/.test(l)?'<span class="dpb">'+esc(l)+'</span>':esc(l)}).join("\n")}
function itemHtml(it){
return '<div class="item '+esc(it.cls||"")+'"><div class="time">'+esc(it.time)+(it.tag?'<em>'+esc(it.tag)+'</em>':'')+'</div><div class="dot"></div><div class="body"><div class="ico">'+esc(it.ico||"")+'</div><div><div class="t">'+(it.pre?'<span class="'+(/^Plan B/.test(it.pre)?'pb':'pa')+' pre">'+esc(it.pre)+'</span> ':'')+esc(it.title)+(it.tent?' <span class="tent">'+esc(it.tent)+'</span>':'')+(it.sub?' <span'+(/^Plan A/.test(it.sub)?' class="pa"':/^Plan B/.test(it.sub)?' class="pb"':'')+'>'+esc(it.sub)+'</span>':'')+'</div>'+(it.desc?'<div class="d">'+dh(it.desc)+'</div>':'')+'</div></div></div>'}
function peopleHtml(){return '<div><b>主講人：</b>'+esc(S.speaker)+'</div><div><b>主持人：</b>'+esc(S.host)+'</div>'}
function todoHtml(){return S.todo.length?'<div class="todo"><h3>待確認</h3><ul>'+S.todo.map(function(x){return'<li>'+esc(x)+'</li>'}).join("")+'</ul></div>':''}
function renderView(){
if(cur>=S.days.length)cur=Math.max(0,S.days.length-1);
var d=S.days[cur]||{date:"",items:[]},m=meta(d.date);
$("ttl").textContent=d.title||S.title;var bn=!!d.banner;$("ttlImg").hidden=!bn;if(bn){$("ttlImg").src=POSTER;$("ttlImg").alt=d.title||S.title}$("ttl").hidden=bn;$("ttl").className=d.special?"sp":"";
$("meta").textContent=S.days.length?m.label+(d.info?"｜"+d.info:""):"";
$("people").innerHTML=peopleHtml();
$("tabs").innerHTML=S.days.map(function(x,i){var mm=meta(x.date);return'<button class="tab'+(x.special?' sp':'')+(i===cur?' on':'')+'" data-a="day" data-i="'+i+'"><b>'+mm.tab+'</b><small>'+mm.wd+'</small></button>'}).join("");
$("list").innerHTML=(d.items&&d.items.length)?d.items.map(itemHtml).join(""):'<div class="empty">這一天還沒有排定行程。</div>';
$("todo").innerHTML=todoHtml();
$("upd").textContent="最後更新 "+S.upd;
}
function F(label,attr,val,ph){return'<label class="f"><span>'+label+'</span><input '+attr+' value="'+esc(val)+'" placeholder="'+esc(ph||"")+'"></label>'}
function itemEdit(it,i,n){
var a='data-i="'+i+'" data-f="',b=function(act,txt,x){return'<button data-a="'+act+'" data-i="'+i+'"'+(x||"")+'>'+txt+'</button>'};
return'<div class="ecard"><div class="ehead"><b>第 '+(i+1)+' 項</b><span class="acts">'+b("up","↑",i?"":" disabled")+b("down","↓",i<n-1?"":" disabled")+b("ins","＋下方插入")+b("dup","複製")+b("del","刪除",' class="danger"')+'</span></div>'
+'<div class="row2">'+F("時間",a+'time"',it.time,"13:30-14:00")+F("圖示（一個表情符號）",a+'ico"',it.ico,"📌")+'</div>'
+F("標題前標示（如 Plan A，會用彩色顯示）",a+'pre"',it.pre,"Plan A")+F("標題",a+'title"',it.title,"")
+'<div class="row2">'+F("標題後括號備註",a+'sub"',it.sub,"(含問答)")+F("橘色標示",a+'tent"',it.tent,"(預定)")+'</div>'
+F("副標（標題下方小字）",a+'desc"',it.desc,"")
+'<div class="row2">'+F("時間下方小標",a+'tag"',it.tag,"主要活動")+'<label class="f"><span>底色</span><select '+a+'cls"><option value=""'+(!it.cls?' selected':'')+'>無</option><option value="hl"'+(it.cls==="hl"?' selected':'')+'>灰底</option><option value="main"'+(it.cls==="main"?' selected':'')+'>藍底（重點）</option><option value="pa"'+(it.cls==="pa"?' selected':'')+'>紫底（Plan A）</option><option value="pb"'+(it.cls==="pb"?' selected':'')+'>橘底（Plan B）</option></select></label></div></div>'}
function renderEdit(msg,isErr){
var d=S.days[cur],h='<div class="bar"><b>編輯模式</b><button data-a="cancel">取消</button><button class="pri" data-a="save">儲存</button><div class="stat" id="stat">'+esc(msg||"改完請按「儲存」才會生效")+'</div></div>';
h+='<div class="ebox"><h3>頁首</h3>'+F("總標題",'data-s="title"',S.title)+F("主講人",'data-s="speaker"',S.speaker)+F("主持人",'data-s="host"',S.host)+'<label class="f"><span>待確認（每行一項，清空即不顯示）</span><textarea data-s="todo">'+esc(S.todo.join("\n"))+'</textarea></label></div>';
h+='<div class="tabs">'+S.days.map(function(x,i){var mm=meta(x.date);return'<button class="tab'+(i===cur?' on':'')+'" data-a="day" data-i="'+i+'"><b>'+mm.tab+'</b><small>'+mm.wd+'</small></button>'}).join("")+'<button class="tab add" data-a="addday">＋新增一天</button></div>';
if(d){h+='<div class="ebox"><h3>'+meta(d.date).label+' 這一天</h3><label class="f"><span>日期（儲存時會自動依日期排序）</span><input type="date" data-s="d.date" value="'+esc(d.date)+'"></label>'+F("這天的標題（留空則用總標題）",'data-s="d.title"',d.title)+F("時間與地點（顯示在日期後面）",'data-s="d.info"',d.info,"例：13:30–16:00｜圖書館 7 樓")+'<label class="f"><input type="checkbox" data-s="d.special"'+(d.special?' checked':'')+' style="width:auto"> 特別日（標題與分頁用紅色強調）</label><label class="f"><input type="checkbox" data-s="d.banner"'+(d.banner?' checked':'')+' style="width:auto"> 用活動海報圖片取代標題</label><button class="danger" data-a="delday">刪除這一天</button></div>';
h+=d.items.map(function(it,i){return itemEdit(it,i,d.items.length)}).join("");
h+='<div class="etools"><button data-a="additem">＋新增行程</button><button data-a="sort">依時間排序</button></div>'}
$("editor").innerHTML=h;

if(!first)pdf.addPage();first=false;pdf.addImage(sl.toDataURL("image/jpeg",0.92),"JPEG",10,10,PW,(end-y)*PW/W);y=end}

(async function(){try{db=window.claude&&await window.claude.use("db")}catch(e){db=null}
if(!db){canW=false;items=(window.SNAP&&SNAP.staff)||[];people=(window.SNAP&&SNAP.people)||[];render();g("stStatus").style.color="var(--mute)";g("stStatus").textContent=(window.claude?"目前未登入，顯示 ":"最後更新 ")+((window.SNAP&&SNAP.at)||"")+(window.claude?" 更新的版本（僅供查閱）。":"（僅供查閱）");return}

<script>
(function(){
var SK='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
var K1="__"+"SNAP__",K2="__"+"SRC__";
var live={schedule:null,tasks:null,folders:null,staff:null,people:null},dismissed=false,busy=false,art=null,webMeta=undefined,dbRef=null;
function g(id){return document.getElementById(id)}
function stable(v){if(Array.isArray(v))return"["+v.map(stable).join(",")+"]";if(v&&typeof v==="object")return"{"+Object.keys(v).sort().filter(function(k){return v[k]!==undefined}).map(function(k){return JSON.stringify(k)+":"+stable(v[k])}).join(",")+"}";return JSON.stringify(v)}
function byId(a){return(a||[]).slice().sort(function(x,y){return x.id<y.id?-1:1})}
function differs(){var S=window.SNAP||{};return stable(live.schedule)!==stable(S.schedule)||stable(byId(live.tasks))!==stable(byId(S.tasks))||stable(byId(live.folders))!==stable(byId(S.folders))||stable(byId(live.staff))!==stable(byId(S.staff))||stable(byId(live.people))!==stable(byId(S.people))}
function fvis(boss){return live.folders.filter(function(f){return boss?(f.vis==="boss"||f.vis==="both"):f.vis!=="boss"})}
function hashLive(boss){var s=stable({schedule:live.schedule,tasks:byId(live.tasks),folders:byId(fvis(boss)),staff:byId(live.staff),people:byId(live.people)}),h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)}
function check(){if(dismissed||busy||!live.schedule||!live.tasks||!live.folders||!live.staff||!live.people||webMeta===undefined)return;
var d=differs(),wb=!webMeta||webMeta.hashBoss!==hashLive(true),wt=!webMeta||webMeta.hashTeam!==hashLive(false),w=wb||wt;
g("pubBar").hidden=!(d||w);g("pubGo").hidden=!d;g("webGoBoss").hidden=!wb;g("webGoTeam").hidden=!wt;
var t=[];if(d)t.push("Claude 頁面的公開版本還是 "+((window.SNAP&&SNAP.at)||"")+" 的內容。");
if(w)t.push("GitHub 網頁版還沒更新（"+[wb?"長官版":"",wt?"工作人員版":""].filter(Boolean).join("、")+"）：按下方按鈕下載，再上傳到 GitHub 的 nobel-2026。");
g("pubTxt").textContent="內容已修改。"+t.join(" ")}
function b64enc(s){var b=new TextEncoder().encode(s),o="";for(var i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)}
function b64dec(s){var r=atob(s.trim()),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return new TextDecoder().decode(u)}
function stamp(){var d=new Date(Date.now()+8*3600e3).toISOString();return d.slice(5,7)+"/"+d.slice(8,10)+" "+d.slice(11,16)}
g("pubLater").addEventListener("click",function(){dismissed=true;g("pubBar").hidden=true});
g("pubGo").addEventListener("click",async function(){
if(busy)return;busy=true;g("pubGo").disabled=true;g("pubTxt").textContent="正在更新公開版本…";
try{
if(!art)art=await window.claude.use("artifact");
if(!art)throw{code:"not_granted"};
var tpl=b64dec(g("pagesrc").textContent);
var snap={schedule:live.schedule,tasks:byId(live.tasks),folders:byId(live.folders),staff:byId(live.staff),people:byId(live.people),at:stamp()};
var js="var SNAP="+JSON.stringify(snap).replace(/<\//g,"<\\/")+";var DEFAULT=SNAP.schedule;";
var page=tpl.split(K1).join(js).split(K2).join(b64enc(tpl));
await art.publish(SK+page+"</body></html>");
g("pubTxt").textContent="已更新公開版本。";
}catch(e){busy=false;g("pubGo").disabled=false;var c=e&&e.code;
g("pubTxt").textContent=c==="not_granted"||c==="not_writer"?"你沒有更新公開版本的權限，請通知頁面擁有者。":c==="conflict"?"頁面剛被其他人更新，重新載入後再試一次。":"更新失敗，請稍後再試。"}});
if(!window.claude)document.querySelectorAll(".cl-only").forEach(function(b){b.hidden=true});
var dlns=null;
async function dlWeb(boss){
if(!live.schedule||!live.tasks||!live.folders||!live.staff||!live.people){toast2("資料還在載入，請稍候再按一次。");return}
var fn=boss?"index.html":"team.html";
try{if(!dlns)dlns=await window.claude.use("downloads");if(!dlns){toast2("此環境無法下載。");return}
var tpl=b64dec(g("pagesrc").textContent);
var snap={schedule:live.schedule,tasks:byId(live.tasks),folders:byId(fvis(boss)),staff:byId(live.staff),people:byId(live.people),at:stamp()};if(boss&&!snap.folders.length)snap.hideFiles=true;
var js="var SNAP="+JSON.stringify(snap).replace(/<\//g,"<\\/")+";var DEFAULT=SNAP.schedule;";
var page=tpl.split(K1).join(js).split(K2).join("");
var doc='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body>'+page+'</body></html>';
await dlns.save({filename:fn,data:doc});toast2("已下載 "+fn+"，請到 GitHub 的 nobel-2026 上傳覆蓋同名舊檔。");
if(dbRef){var upd={};upd[boss?"hashBoss":"hashTeam"]=hashLive(boss);upd[boss?"atBoss":"atTeam"]=snap.at;
try{if(webMeta)await dbRef.doc("meta/web").update(upd);else await dbRef.doc("meta/web").set(upd)}catch(e){}}}
catch(e){if(!e||e.code!=="declined")toast2("下載失敗，請稍後再試。")}}
g("webDlBoss").addEventListener("click",function(){dlWeb(true)});
g("webDlTeam").addEventListener("click",function(){dlWeb(false)});
function toast2(t){var e=g("toast");if(!e)return;e.textContent=t;e.hidden=false;setTimeout(function(){e.hidden=true},3500)}
(async function(){var db;try{db=window.claude&&await window.claude.use("db")}catch(e){db=null}if(!db)return;
g("webBar").hidden=false;dbRef=db;
g("webGoBoss").addEventListener("click",function(){dlWeb(true)});g("webGoTeam").addEventListener("click",function(){dlWeb(false)});
db.doc("meta/web").onSnapshot(function(s){webMeta=s.exists?s.data():null;check()},function(){webMeta=null;check()});
db.doc("schedule/main").onSnapshot(function(s){live.schedule=s.exists?s.data():null;check()},function(){});
db.collection("tasks").onSnapshot(function(s){live.tasks=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});check()},function(){});
db.collection("folders").onSnapshot(function(s){live.folders=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});check()},function(){});
db.collection("staff").onSnapshot(function(s){live.staff=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});check()},function(){});
db.collection("people").onSnapshot(function(s){live.people=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});check()},function(){});
})();
})();
</script>
